[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-agent"
version = "0.1.0"
description = "An LLM-powered coding agent that generates software packages from plain-language specifications"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
spec-agent = "spec_agent.cli:main"

[tool.setuptools.packages.find]
include = ["spec_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
